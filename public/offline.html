<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Mihad Free Video</title>
    <style>
      :root {
        --gold: #f5a623;
        --gold-light: #ffd24d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(245,166,35,.12), transparent 60%),
          #050505;
        color: #f5f5f5;
        padding: 24px;
        text-align: center;
      }
      .wrap { max-width: 440px; }
      .badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 96px; height: 96px; margin: 0 auto 28px;
        border-radius: 28px;
        background: linear-gradient(135deg, #ffd24d, #f5a623 50%, #d98a0a);
        box-shadow: 0 0 50px -8px rgba(245,166,35,.6);
      }
      .badge svg { width: 48px; height: 48px; color: #000; }
      h1 {
        font-size: 28px; margin-bottom: 12px;
        background: linear-gradient(135deg,#ffe585,#f5a623 50%,#d98a0a);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p { color: #a3a3a3; line-height: 1.6; margin-bottom: 28px; font-size: 16px; }
      button {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 14px 28px; border: none; border-radius: 16px;
        font-size: 16px; font-weight: 700; cursor: pointer; color: #000;
        background: linear-gradient(135deg, #ffd24d, #f5a623 50%, #d98a0a);
        box-shadow: 0 8px 24px -8px rgba(245,166,35,.7);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You're Offline</h1>
      <p>
        We couldn't reach the internet. Check your connection and try again —
        previously visited pages may still be available.
      </p>
      <button onclick="location.reload()">Try Again</button>
    </div>
  </body>
</html>
